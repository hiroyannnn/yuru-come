<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yuru-come</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>yuru-come</h1>
    <p class="context" id="context"></p>
    <p class="conn" id="conn" role="status">接続中…</p>
  </header>
  <main class="panels">
    <section class="panel pickups" aria-labelledby="pickups-title">
      <h2 id="pickups-title">気になるコメント <span class="count" id="pickup-count"></span></h2>
      <p class="hint">拾うならこのあたり。クリックで既読。5 分で薄くなり、10 分で消えます。</p>
      <ol class="pickup-list" id="pickups"></ol>
      <p class="empty" id="pickups-empty">いまは拾うものがありません。全部読まなくて大丈夫。</p>
    </section>

    <section class="panel mood" aria-labelledby="mood-title">
      <h2 id="mood-title">いまの空気</h2>
      <p class="summary" id="summary"><span class="summary-text" id="summary-text"></span> <span class="summary-source" id="summary-source"></span></p>
      <div class="bundles" id="bundles" aria-label="直近の反応の束"></div>
      <p class="empty" id="bundles-empty">まとまった反応はまだありません。</p>

      <div class="meters">
        <div class="meter"><span class="meter-value" id="rate">0.0</span><span class="meter-label">件/秒（30 秒）</span></div>
        <div class="meter"><span class="meter-value" id="participants">0</span><span class="meter-label">人（30 秒）</span></div>
        <div class="meter"><span class="meter-value" id="rate-long">0.0</span><span class="meter-label">件/秒（5 分）</span></div>
      </div>

      <h3>種類の分布 <span class="sub">直近 5 分</span></h3>
      <div class="kindbar" id="kindbar" role="img" aria-label="種類の分布"></div>
      <ul class="legend" id="legend"></ul>

      <h3>Jev</h3>
      <div class="queue">
        <div class="queue-track"><div class="queue-fill" id="queue-fill"></div></div>
        <p class="queue-text" id="queue-text"></p>
      </div>
      <p class="stats" id="stats"></p>
    </section>

    <section class="panel flow" aria-labelledby="flow-title">
      <h2 id="flow-title">全部の流れ</h2>
      <ol class="flow-list" id="flow"></ol>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
