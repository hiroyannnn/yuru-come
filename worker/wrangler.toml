name = "yuru-come"
main = "index.mjs"
compatibility_date = "2026-09-01"

[build]
command = "cd .. && ./scripts/build_site.sh"
watch_dir = ["../lib", "../jsapi", "../site", "../web"]

[assets]
directory = "../site-dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "GATE"
class_name = "GateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GateDO"]

[vars]
JEV_URL = "https://ai-gateway.vercel.sh/typesafe"
JEV_MODEL = "typesafe-ai/jev"
# 1 日（UTC）の判定数の上限。Jev 1 回 約 $0.00003 なので 30000 回で約 $0.8/日
DAILY_LIMIT = "30000"
# 1 つの IP から 1 分あたりの判定数の上限（混雑した配信で 1〜3 回/秒）
PER_IP_PER_MINUTE = "300"

# JEV_API_KEY は secret: npx wrangler secret put JEV_API_KEY
